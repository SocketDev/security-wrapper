[project]
name = "security-wrapper"
version = "1.0.21"
description = "Security tools scanning wrapper"
requires-python = ">=3.9"
dependencies = [
    "mdutils~=1.6.0",
    "PyGithub~=2.4.0",
    "requests~=2.32.3",
    "tabulate~=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
